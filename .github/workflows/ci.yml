name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "25.6.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      # The build script runs typecheck before bundling.
      - run: npm run build
